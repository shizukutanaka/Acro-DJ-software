[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "acro-dj-mixer"
version = "3.2.0"
description = "Professional open-source DJ mixing application with ultra-low latency audio, intelligent beat matching, and network ensemble capability"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Acro Development Team", email = "acro@example.com"},
]
maintainers = [
    {name = "Acro Development Team", email = "acro@example.com"},
]
keywords = ["dj", "mixer", "audio", "music", "tkinter", "effects", "midi", "multilingual", "low-latency", "beat-matching", "ensemble", "network", "professional"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: X11 Applications :: GTK",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Natural Language :: Chinese (Simplified)",
    "Natural Language :: Chinese (Traditional)",
    "Natural Language :: French",
    "Natural Language :: German",
    "Natural Language :: Japanese",
    "Natural Language :: Spanish",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Sound/Audio :: Mixers",
    "Topic :: Home Automation",
]

dependencies = [
    "numpy>=1.21.0,<2.0.0",
    "sounddevice>=0.4.5",
    "soundfile>=0.11.0",
    "librosa>=0.10.0",
    "scipy>=1.7.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "loguru>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.0",
    "pytest-xdist>=3.3.0",
    "ruff>=0.7.0",
    "mypy>=1.8.0",
    "pre-commit>=3.5.0",
    "black>=24.0.0",
]
docs = [
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=2.0.0",
    "sphinx-autodoc-typehints>=1.25.0",
    "myst-parser>=2.0.0",
    "sphinx-autobuild>=2024.0.0",
]
midi = [
    "mido>=1.3.0",
]
test = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.0",
]
all = [
    "acro-dj-mixer[dev,docs,midi,test]",
]

[project.urls]
Homepage = "https://github.com/acro-dj/acro-dj-mixer"
Documentation = "https://acro-dj-mixer.readthedocs.io"
Repository = "https://github.com/acro-dj/acro-dj-mixer"
Issues = "https://github.com/acro-dj/acro-dj-mixer/issues"
Changelog = "https://github.com/acro-dj/acro-dj-mixer/blob/main/CHANGELOG.md"
Discussions = "https://github.com/acro-dj/acro-dj-mixer/discussions"

[project.scripts]
acro = "acro.cli:main"
acro-v3-0 = "acro_v3_0_low_latency:main"
acro-v3-1 = "acro_v3_1_beatmatching:main"
acro-v3-2 = "acro_v3_2_network:main"

[project.gui-scripts]
acro-gui = "acro.mixer:gui_main"
acro-low-latency = "acro_v3_0_low_latency:main"
acro-beatmatch = "acro_v3_1_beatmatching:main"
acro-ensemble = "acro_v3_2_network:main"

# Plugin entry points
[project.entry-points."acro.effects"]
# Built-in effects - will be populated after plugin architecture

[project.entry-points."acro.controllers"]
# Built-in controllers - will be populated after plugin architecture

# Hatchling configuration
[tool.hatch.version]
path = "acro/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["acro"]

[tool.hatch.build.targets.sdist]
include = [
    "/acro",
    "/tests",
    "/docs",
    "/examples",
    "LICENSE",
    "README.md",
    "CHANGELOG.md",
    "pyproject.toml",
    "requirements.txt",
]

# Ruff configuration - Ultra-fast linting and formatting
[tool.ruff]
target-version = "py38"
line-length = 88
indent-width = 4
extend-exclude = ["__pycache__", "*.egg-info", ".venv", ".git"]

[tool.ruff.lint]
# Comprehensive rule sets for production code quality
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort (import sorting)
    "N",      # pep8-naming
    "D",      # pydocstyle
    "UP",     # pyupgrade
    "ANN",    # flake8-annotations
    "S",      # flake8-bandit (security)
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "T10",    # flake8-debugger
    "ISC",    # flake8-implicit-str-concat
    "G",      # flake8-logging-format
    "PIE",    # flake8-pie
    "T20",    # flake8-print
    "PT",     # flake8-pytest-style
    "Q",      # flake8-quotes
    "RET",    # flake8-return
    "SIM",    # flake8-simplify
    "TID",    # flake8-tidy-imports
    "ARG",    # flake8-unused-arguments
    "PTH",    # flake8-use-pathlib
    "PL",     # Pylint
    "RUF",    # Ruff-specific rules
]

ignore = [
    "D100",   # Missing docstring in public module (optional)
    "D104",   # Missing docstring in public package (optional)
    "ANN101", # Missing type annotation for self
    "ANN102", # Missing type annotation for cls
    "S101",   # Use of assert (allowed in tests)
    "D103",   # Missing docstring in public function (for now)
]

fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "D103", "D100"]
"**/conftest.py" = ["D100"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["acro"]
known-third-party = ["numpy", "scipy", "librosa"]

# MyPy static type checking
[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
exclude = ["^tests/", "^build/"]

[[tool.mypy.overrides]]
module = [
    "sounddevice.*",
    "soundfile.*",
    "librosa.*",
    "scipy.*",
    "numpy.*",
    "mido.*",
]
ignore_missing_imports = true

# Pytest configuration
[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
    "--cov=acro",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=html",
    "--cov-report=xml",
    "-v",
    "--strict-markers",
    "--tb=short",
]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "audio: marks tests requiring audio system",
    "midi: marks tests requiring MIDI system",
]
norecursedirs = [".git", ".venv", "__pycache__", "*.egg-info"]

# Coverage configuration
[tool.coverage.run]
source = ["acro"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__init__.py",
    "*/cli.py",
]
parallel = true
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "if 0:",
    "if False:",
]
precision = 2
show_missing = true
skip_covered = false

[tool.coverage.html]
directory = "htmlcov"

# Black code formatter (if not using Ruff format)
[tool.black]
line-length = 88
target-version = ["py38", "py39", "py310", "py311"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

# Semantic versioning
[tool.semantic_release]
version_variable = "acro/__init__.py:__version__"
version_pattern = '__version__ = "{version}"'
upload_to_pypi = true
upload_to_release = true
remove_dist = false

[[tool.semantic_release.repository.publish_plugin.postpublish_cmds]]
cmd = "gh release upload v{version} dist/* --repo {repo} || true"

# Package discovery
[tool.setuptools]
packages = ["acro"]

[tool.setuptools.package-data]
acro = ["data/**/*", "translations/*.json"]
